<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
  <title>Jewel Labs</title>
  <style>
    /* Shown only when the app's screens are missing or broken (see window.js). */
    html, body { height: 100%; margin: 0; background: #000000; color: #e9ecf2; }
    body { display: grid; place-items: center; font: 15px/1.5 system-ui, sans-serif; letter-spacing: -0.011em; }
    main { max-width: 440px; padding: 32px; border: 1px solid rgba(255, 255, 255, 0.13); border-radius: 16px; }
    .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.16em; color: #5d6473; }
    h1 { font-size: 20px; font-weight: 600; margin: 8px 0 12px; }
    p { margin: 0 0 10px; color: #99a2b2; }
  </style>
</head>
<body>
  <main>
    <div class="label">Jewel Labs</div>
    <h1>The app could not load its screens.</h1>
    <p>Quit Jewel Labs and open it again. If this keeps happening, download it again from aarushkandukoori.github.io/jewel-labs-desk and install it over this copy.</p>
    <p>Your workspaces and papers are safe; they are kept apart from the app.</p>
  </main>
</body>
</html>
