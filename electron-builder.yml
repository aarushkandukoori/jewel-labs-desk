# How the desktop app is packaged: npx electron-builder --mac  or  --win
# The release workflow (.github/workflows/release.yml) runs this for every v* tag and uploads the
# installers to the GitHub release, where the website's download buttons point.
appId: io.jewellabs.desk
productName: Jewel Labs
copyright: Jewel Labs

directories:
  output: dist
  buildResources: build

# What goes into the app. Production node_modules are added by electron-builder itself
# (devDependencies such as electron, playwright and electron-builder are left out).
files:
  - src/**
  - assets/**
  - samples/sample-shipment/**
  - package.json
  # The app's own license and the index of the third-party notices (their full texts ship with src/ and node_modules/).
  - LICENSE
  - THIRD_PARTY_NOTICES.md
  - "!**/*.test.js"
  - "!**/__tests__/**"
  - "!test/**"
  - "!site/**"
  - "!site-dist/**"
  # Source maps and the pdf.js viewer and type files are not needed to run.
  - "!**/node_modules/**/*.map"
  - "!**/node_modules/pdfjs-dist/{web,types}/**"

asar: true
# Worker threads and WebAssembly files cannot run from inside the app.asar archive, so these stay
# outside it (in app.asar.unpacked). src/main/main.js points pdf.js at the unpacked wasm folder.
asarUnpack:
  - node_modules/tesseract.js/**
  - node_modules/tesseract.js-core/**
  - node_modules/@tesseract.js-data/**
  # The OCR worker thread also loads these four from outside the archive.
  - node_modules/bmp-js/**
  - node_modules/is-url/**
  - node_modules/regenerator-runtime/**
  - node_modules/wasm-feature-detect/**
  - node_modules/pdfjs-dist/**

# Everything here is plain JavaScript and WebAssembly: there are no native modules to rebuild.
npmRebuild: false

# Electron fuses, flipped in the app binary itself. Without them, starting the installed app with
# ELECTRON_RUN_AS_NODE=1, NODE_OPTIONS or --inspect would run any code under the app's identity, which the
# Keychain item (the OpenAI key, mailbox app passwords, the sign-in) and the Documents/Desktop grants trust.
# The app code must come from app.asar, checked against its hash in Info.plist (or the Windows exe resource).
# Our pages load from app:// (src/main/window.js), never from file://, so file:// pages get no extra privileges.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  enableCookieEncryption: true
  grantFileProtocolExtraPrivileges: false

mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  category: public.app-category.business
  artifactName: "Jewel-Labs-mac-${arch}.${ext}"
  icon: build/icon.png
  # The hardened runtime stops other programs from injecting code (DYLD_INSERT_LIBRARIES) or attaching a
  # debugger. build/entitlements.mac.plist lists what the app may still do (JIT for V8 and WebAssembly, and
  # library validation off, which an ad hoc signature needs to load the Electron framework).
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # We have no Apple Developer ID yet. "-" signs the app ad hoc: without any signature, macOS calls a
  # downloaded Apple silicon app "damaged" and offers no way to open it. With the ad hoc signature the person
  # can open it from System Settings > Privacy & Security > Open Anyway, or install it with site/install.sh.
  # Once the Apple secrets are in GitHub, the release workflow builds with -c.mac.identity="Developer ID Application"
  # instead, and electron-builder notarizes by itself because APPLE_API_KEY, APPLE_API_KEY_ID and APPLE_API_ISSUER
  # are set (see "Turning on Apple signing" in README.md). notarize is left unset on purpose.
  identity: "-"
  extendInfo:
    NSDocumentsFolderUsageDescription: Jewel Labs reads the shipment papers in the folder you choose.
    NSDesktopFolderUsageDescription: Jewel Labs reads the shipment papers in the folder you choose.
    NSDownloadsFolderUsageDescription: Jewel Labs reads the shipment papers in the folder you choose.

dmg:
  title: "Jewel Labs ${version}"
  # The disk image itself stays unsigned: Apple accepts a notarized, stapled app inside an unsigned image, and
  # electron-builder warns that signing the image clashes with notarization.
  sign: false

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: "Jewel-Labs-windows-setup.${ext}"
  icon: build/icon-win.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Jewel Labs
  runAfterFinish: true

publish:
  provider: github
  owner: aarushkandukoori
  repo: jewel-labs-desk
  releaseType: release
