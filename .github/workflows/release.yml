# Builds the Mac and Windows installers and attaches them to a GitHub release.
# Runs when a version tag is pushed (git tag v1.0.0 && git push origin v1.0.0), or by hand from the
# Actions tab. The tag must match the version in package.json.
#
# Only the release and publish jobs can write to the repository. The builds run the project's code with read-only
# access: they install without install scripts, build with --publish never and hand the installers over as
# workflow artifacts, and the publish job uploads those to the release. Every action is pinned to a full commit.
# The Mac build is signed with the Developer ID and notarized once the Apple secrets exist (README.md, "Turning on
# Apple signing"); until then it is signed ad hoc.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions: {}

jobs:
  # Create the release once, before the builds.
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - id: version
        name: Read the version
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$TAG" ]; then
            echo "The tag $GITHUB_REF_NAME does not match package.json ($TAG). Change one of them." >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Create the GitHub release if it does not exist yet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Jewel Labs $TAG" \
              --notes "Download Jewel Labs for Mac (Apple silicon or Intel) or Windows below."
          fi

  build:
    needs: release
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac --arm64 --x64
            name: mac
          - os: windows-latest
            args: --win --x64
            name: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install
        # No install scripts: electron-builder downloads its own Electron for each platform, and no other
        # package needs one to build (tesseract.js only prints a message, electron-winstaller is not used).
        run: npm ci --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Build the installers (Windows)
        if: matrix.name == 'windows'
        run: npx electron-builder ${{ matrix.args }} --publish never

      # Mac: signed with the Developer ID and notarized by Apple when all five Apple secrets exist (see "Turning on
      # Apple signing" in README.md), otherwise signed ad hoc as before. The secrets go to this step only: the
      # Windows build would also read CSC_LINK. A partial set of APPLE_* variables makes electron-builder stop, so
      # the ad hoc path unsets all of them.
      - name: Build the installers (Mac)
        id: mac-build
        if: matrix.name == 'mac'
        shell: bash
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID_SECRET: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_SECRET: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          missing=""
          for name in MAC_CERT_P12_BASE64 MAC_CERT_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID_SECRET APPLE_API_ISSUER_SECRET; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -z "$missing" ]; then
            echo "Signing with the Developer ID and notarizing"
            echo "signing=developer-id" >> "$GITHUB_OUTPUT"
            key_file="$RUNNER_TEMP/AuthKey.p8"
            trap 'rm -f "$key_file"' EXIT
            printf '%s' "$APPLE_API_KEY_P8" > "$key_file"
            export CSC_LINK="$MAC_CERT_P12_BASE64" CSC_KEY_PASSWORD="$MAC_CERT_PASSWORD"
            export APPLE_API_KEY="$key_file" APPLE_API_KEY_ID="$APPLE_API_KEY_ID_SECRET" APPLE_API_ISSUER="$APPLE_API_ISSUER_SECRET"
            npx electron-builder ${{ matrix.args }} --publish never -c.mac.identity="Developer ID Application"
          else
            if [ "$missing" != " MAC_CERT_P12_BASE64 MAC_CERT_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID_SECRET APPLE_API_ISSUER_SECRET" ]; then
              echo "::warning::Some Apple secrets are missing (${missing# }), so the Mac app is signed ad hoc and not notarized."
            fi
            echo "No Apple Developer ID: ad hoc build (a browser download shows the macOS malware warning)"
            echo "signing=adhoc" >> "$GITHUB_OUTPUT"
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID APPLE_KEYCHAIN_PROFILE
            npx electron-builder ${{ matrix.args }} --publish never
          fi

      # Checks both Mac apps: a valid signature with the hardened runtime, and for a Developer ID build also the
      # stapled notarization ticket and Gatekeeper's verdict ("source=Notarized Developer ID").
      - name: Check the Mac apps
        if: matrix.name == 'mac'
        shell: bash
        env:
          SIGNING: ${{ steps.mac-build.outputs.signing }}
        run: |
          for app in "dist/mac-arm64/Jewel Labs.app" "dist/mac/Jewel Labs.app"; do
            echo "== $app ($SIGNING)"
            codesign --verify --deep --strict --verbose=2 "$app"
            details="$(codesign -dvv "$app" 2>&1)"
            echo "$details" | grep -E "Authority|TeamIdentifier|flags|Timestamp" || true
            echo "$details" | grep -q "runtime" || { echo "::error::$app is not signed with the hardened runtime"; exit 1; }
            if [ "$SIGNING" = "developer-id" ]; then
              echo "$details" | grep -q "Authority=Developer ID Application" || { echo "::error::$app is not signed with the Developer ID"; exit 1; }
              xcrun stapler validate "$app"
              spctl --assess --verbose=4 --type execute "$app"
            fi
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installers-${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error
          retention-days: 7

  # Upload the installers to the release made above (also when a build is re-run hours later).
  publish:
    needs: [release, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: installers-*
          path: installers
          merge-multiple: true
      - name: Upload the installers to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          ls -l installers
          gh release upload "$TAG" installers/* --clobber
